apiVersion: v1
kind: ServiceAccount
metadata:
  name: commerce-services
  namespace: commerce
---
apiVersion: v1
kind: ConfigMap
metadata: { name: phase4-service-config, namespace: commerce }
data:
  LOG_FORMAT: json
  EVENT_SCHEMA_VERSION: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: inventory-service, namespace: commerce }
spec:
  replicas: 2
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata: { labels: { app: inventory-service } }
    spec:
      serviceAccountName: commerce-services
      terminationGracePeriodSeconds: 30
      containers:
        - name: inventory-service
          image: commerce/inventory-service:latest
          ports: [{ name: http, containerPort: 8087 }]
          envFrom: [{ configMapRef: { name: phase4-service-config } }]
          env:
            - { name: INVENTORY_DATABASE_URL, valueFrom: { secretKeyRef: { name: commerce-runtime, key: inventory-database-url } } }
            - { name: INVENTORY_DATABASE_USERNAME, valueFrom: { secretKeyRef: { name: commerce-runtime, key: database-username } } }
            - { name: INVENTORY_DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: commerce-runtime, key: database-password } } }
            - { name: INVENTORY_REDIS_URL, valueFrom: { secretKeyRef: { name: commerce-runtime, key: redis-url } } }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { secretKeyRef: { name: commerce-runtime, key: kafka-bootstrap-servers } } }
            - { name: JWT_KEYS, valueFrom: { secretKeyRef: { name: commerce-runtime, key: jwt-keys } } }
            - { name: IDENTITY_TENANT_ID, value: default }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 15, periodSeconds: 15 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: inventory-service, namespace: commerce }
spec: { selector: { app: inventory-service }, ports: [{ name: http, port: 8087, targetPort: http }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: inventory-service, namespace: commerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: inventory-service }
  minReplicas: 2
  maxReplicas: 20
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }, { type: Resource, resource: { name: memory, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: inventory-service, namespace: commerce }
spec: { minAvailable: 1, selector: { matchLabels: { app: inventory-service } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cart-service, namespace: commerce }
spec:
  replicas: 2
  selector: { matchLabels: { app: cart-service } }
  template:
    metadata: { labels: { app: cart-service } }
    spec:
      serviceAccountName: commerce-services
      terminationGracePeriodSeconds: 30
      containers:
        - name: cart-service
          image: commerce/cart-service:latest
          ports: [{ name: http, containerPort: 8088 }]
          envFrom: [{ configMapRef: { name: phase4-service-config } }]
          env:
            - { name: CART_DATABASE_URL, valueFrom: { secretKeyRef: { name: commerce-runtime, key: cart-database-url } } }
            - { name: CART_DATABASE_USERNAME, valueFrom: { secretKeyRef: { name: commerce-runtime, key: database-username } } }
            - { name: CART_DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: commerce-runtime, key: database-password } } }
            - { name: CART_REDIS_URL, valueFrom: { secretKeyRef: { name: commerce-runtime, key: redis-url } } }
            - { name: PRICING_BASE_URL, value: "http://pricing-service:8084" }
            - { name: INVENTORY_BASE_URL, value: "http://inventory-service:8087" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { secretKeyRef: { name: commerce-runtime, key: kafka-bootstrap-servers } } }
            - { name: JWT_KEYS, valueFrom: { secretKeyRef: { name: commerce-runtime, key: jwt-keys } } }
            - { name: IDENTITY_TENANT_ID, value: default }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 15, periodSeconds: 15 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: cart-service, namespace: commerce }
spec: { selector: { app: cart-service }, ports: [{ name: http, port: 8088, targetPort: http }] }
---
apiVersion: autoscaling/v2
