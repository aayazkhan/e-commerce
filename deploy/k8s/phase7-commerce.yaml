apiVersion: v1
kind: ConfigMap
metadata:
  name: phase7-service-config
  namespace: commerce
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_URL: redis://redis:6379
  DATABASE_USERNAME: commerce
  IDENTITY_URL: http://identity-service:8081
  CATALOG_URL: http://catalog-service:8083
  PROMOTION_URL: http://promotion-service:8090
  ORDER_URL: http://order-service:8091
  ANALYTICS_URL: http://analytics-service:8099
  AUDIT_URL: http://audit-service:8102
  CMS_URL: http://cms-service:8101
  FLAGS_URL: http://feature-flag-service:8103
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: seller-service, namespace: commerce }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: seller-service } }
  template:
    metadata: { labels: { app: seller-service, commerce.network/managed: "true" } }
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: seller-service } }
      containers:
        - name: seller-service
          image: commerce/seller-service:latest
          ports: [{ name: http, containerPort: 8100 }]
          envFrom: [{ configMapRef: { name: phase7-service-config } }]
          env:
            - { name: SELLER_DATABASE_URL, valueFrom: { secretKeyRef: { name: commerce-runtime, key: seller-database-url } } }
            - { name: DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: commerce-runtime, key: database-password } } }
            - { name: JWT_KEYS, valueFrom: { secretKeyRef: { name: commerce-runtime, key: jwt-keys } } }
            - { name: INTERNAL_SERVICE_TOKEN, valueFrom: { secretKeyRef: { name: commerce-runtime, key: internal-service-token } } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 15, periodSeconds: 15 }
          startupProbe: { httpGet: { path: /health/live, port: http }, failureThreshold: 30, periodSeconds: 5 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "2", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: seller-service, namespace: commerce }
spec: { selector: { app: seller-service }, ports: [{ name: http, port: 8100, targetPort: http }] }
---
