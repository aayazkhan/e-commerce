apiVersion: v1
kind: ResourceQuota
metadata:
  name: commerce-production-quota
  namespace: commerce
spec:
  # Starting guardrails only; calibrate against measured capacity before apply.
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    limits.cpu: "200"
    limits.memory: 400Gi
    pods: "250"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: commerce-production-limits
  namespace: commerce
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
