# External Secrets Operator example. Select the real provider/SecretStore and
# IAM/workload identity policy for the target cloud before applying.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: commerce-runtime
  namespace: commerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: commerce-production-secret-store
    kind: ClusterSecretStore
  target:
    name: commerce-runtime
    creationPolicy: Owner
  data:
    - secretKey: jwt-keys
      remoteRef: { key: commerce/production/jwt-keys }
    - secretKey: internal-service-token
      remoteRef: { key: commerce/production/internal-service-token }
    - secretKey: database-password
      remoteRef: { key: commerce/production/database-password }
    - secretKey: kafka-bootstrap-servers
      remoteRef: { key: commerce/production/kafka-bootstrap-servers }
    - secretKey: payment-provider-api-key
      remoteRef: { key: commerce/production/payment-provider-api-key }
    - secretKey: payment-provider-webhook-secret
      remoteRef: { key: commerce/production/payment-provider-webhook-secret }
