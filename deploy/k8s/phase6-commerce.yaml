apiVersion: v1
kind: ConfigMap
metadata: { name: phase6-service-config, namespace: commerce }
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_URL: redis://redis:6379
  DATABASE_USERNAME: commerce
  NOTIFICATION_DEFAULT_CHANNELS: IN_APP,EMAIL,PUSH
  NOTIFICATION_EMAIL_ENDPOINT: ""
  NOTIFICATION_SMS_ENDPOINT: ""
  NOTIFICATION_FCM_ENDPOINT: ""
  NOTIFICATION_APNS_ENDPOINT: ""
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, namespace: commerce }
spec:
  replicas: 2
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: commerce/notification-service:latest
          ports: [{ name: http, containerPort: 8096 }]
          envFrom: [{ configMapRef: { name: phase6-service-config } }]
          env:
            - { name: NOTIFICATION_DATABASE_URL, valueFrom: { secretKeyRef: { name: commerce-runtime, key: notification-database-url } } }
            - { name: DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: commerce-runtime, key: database-password } } }
            - { name: JWT_KEYS, valueFrom: { secretKeyRef: { name: commerce-runtime, key: jwt-keys } } }
            - { name: NOTIFICATION_EMAIL_API_KEY, valueFrom: { secretKeyRef: { name: commerce-runtime, key: notification-email-api-key } } }
            - { name: NOTIFICATION_SMS_API_KEY, valueFrom: { secretKeyRef: { name: commerce-runtime, key: notification-sms-api-key } } }
            - { name: NOTIFICATION_FCM_API_KEY, valueFrom: { secretKeyRef: { name: commerce-runtime, key: notification-fcm-api-key } } }
            - { name: NOTIFICATION_APNS_API_KEY, valueFrom: { secretKeyRef: { name: commerce-runtime, key: notification-apns-api-key } } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 15, periodSeconds: 15 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "2", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: commerce }
spec: { selector: { app: notification-service }, ports: [{ name: http, port: 8096, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: review-service, namespace: commerce }
spec:
  replicas: 2
  selector: { matchLabels: { app: review-service } }
  template:
