apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-phase3-config
data:
  CATEGORY_REDIS_URL: redis://redis:6379
  CATALOG_REDIS_URL: redis://redis:6379
  PRICING_REDIS_URL: redis://redis:6379
  OPENSEARCH_URL: http://opensearch:9200
  CATALOG_BASE_URL: http://catalog-service:8083
  MEDIA_S3_BUCKET: commerce-media
  MEDIA_S3_ENDPOINT: https://s3.amazonaws.com
  MEDIA_PUBLIC_BASE_URL: https://cdn.example.com/media
  JWT_ISSUER: commerce-identity
  JWT_AUDIENCE: commerce-api
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: category-service, labels: { app: category-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: category-service } }
  template:
    metadata: { labels: { app: category-service } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: category-service
          image: commerce/category-service:local
          ports: [{ name: http, containerPort: 8082 }]
          envFrom: [{ configMapRef: { name: commerce-phase3-config } }]
          env:
            - { name: CATEGORY_DATABASE_URL, valueFrom: { secretKeyRef: { name: category-service-secrets, key: database-url } } }
            - { name: CATEGORY_DATABASE_USERNAME, valueFrom: { secretKeyRef: { name: category-service-secrets, key: database-username } } }
            - { name: CATEGORY_DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: category-service-secrets, key: database-password } } }
            - { name: JWT_KEYS, valueFrom: { secretKeyRef: { name: commerce-identity-secrets, key: jwt-keys } } }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { secretKeyRef: { name: commerce-kafka-secrets, key: bootstrap-servers } } }
            - { name: IDENTITY_TENANT_ID, valueFrom: { secretKeyRef: { name: commerce-tenant-secrets, key: tenant-id } } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 8 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1000m, memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: category-service }
spec: { selector: { app: category-service }, ports: [{ name: http, port: 8082, targetPort: http }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: category-service }
spec: { scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: category-service }, minReplicas: 2, maxReplicas: 10, metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: category-service }
spec: { minAvailable: 1, selector: { matchLabels: { app: category-service } } }
---
