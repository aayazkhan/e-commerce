apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-service-config
data:
  tenant-id: tenant-production
  challenge-delivery-url: https://notification.internal/v1/challenges
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app.kubernetes.io/name: identity-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-service
          image: commerce/identity-service:local
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: IDENTITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: database-url
            - name: IDENTITY_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: database-username
            - name: IDENTITY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: database-password
            - name: IDENTITY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: redis-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: kafka-bootstrap-servers
            - name: JWT_ACTIVE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: jwt-active-key-id
            - name: JWT_KEYS
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: jwt-keys
            - name: IDENTITY_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: identity-service-config
                  key: tenant-id
            - name: CHALLENGE_DELIVERY_URL
              valueFrom:
                configMapKeyRef:
                  name: identity-service-config
                  key: challenge-delivery-url
            - name: CHALLENGE_DELIVERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: challenge-delivery-token
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity-service
spec:
  minReplicas: 2
  maxReplicas: 20
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity-service
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
