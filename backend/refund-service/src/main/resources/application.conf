ktor { deployment { port = 8094
 port = ${?REFUND_PORT}
 shutdownGracePeriod = 5000
 shutdownTimeout = 15000 }
 application { modules = [ com.ecommerce.refund.ApplicationKt.module ] } }
refund {
    database { url = ${?REFUND_DATABASE_URL}
 username = ${?REFUND_DATABASE_USERNAME}
 password = ${?REFUND_DATABASE_PASSWORD}
 maximumPoolSize = 20
 connectionTimeoutMillis = 2000 }
    jwt { issuer = "commerce-identity"
 audience = "commerce-api"
 keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
 topic = "refund.events.v1"
 tenantId = ${?IDENTITY_TENANT_ID} }
    paymentBaseUrl = ${?PAYMENT_SERVICE_URL}
    internalToken = ${?INTERNAL_SERVICE_TOKEN}
}
