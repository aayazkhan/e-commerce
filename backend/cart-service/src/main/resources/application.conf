ktor {
    deployment { port = 8088; port = ${?CART_PORT}; shutdownGracePeriod = 5s; shutdownTimeout = 15s }
    application { modules = [ com.ecommerce.cart.ApplicationKt.module ] }
}
cart {
    database { url = ${?CART_DATABASE_URL}; username = ${?CART_DATABASE_USERNAME}; password = ${?CART_DATABASE_PASSWORD}; maximumPoolSize = 30; connectionTimeoutMillis = 2000 }
    redis { url = ${?CART_REDIS_URL} }
    jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topic = "cart.events.v1"; tenantId = ${?IDENTITY_TENANT_ID} }
    pricingBaseUrl = ${?PRICING_BASE_URL}
    inventoryBaseUrl = ${?INVENTORY_BASE_URL}
    guestExpirationSeconds = 2592000
    userExpirationSeconds = 31536000
}
