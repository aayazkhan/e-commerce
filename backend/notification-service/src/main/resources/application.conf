ktor { deployment { port = 8096; port = ${?NOTIFICATION_PORT} } application { modules = [ com.ecommerce.notification.ApplicationKt.module ] } }
notification {
  database { url = ${?NOTIFICATION_DATABASE_URL}; username = ${?DATABASE_USERNAME}; password = ${?DATABASE_PASSWORD}; maximumPoolSize = 20; connectionTimeoutMillis = 2000 }
  jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} }
  kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; groupId = "notification-service-v1"; topics = "order.events.v1,payment.events.v1,shipping.events.v1,refund.events.v1" }
  defaultChannels = ${?NOTIFICATION_DEFAULT_CHANNELS}
  providers { email { endpoint = ${?NOTIFICATION_EMAIL_ENDPOINT}; apiKey = ${?NOTIFICATION_EMAIL_API_KEY} } sms { endpoint = ${?NOTIFICATION_SMS_ENDPOINT}; apiKey = ${?NOTIFICATION_SMS_API_KEY} } fcm { endpoint = ${?NOTIFICATION_FCM_ENDPOINT}; apiKey = ${?NOTIFICATION_FCM_API_KEY} } apns { endpoint = ${?NOTIFICATION_APNS_ENDPOINT}; apiKey = ${?NOTIFICATION_APNS_API_KEY} } }
}
