ktor {
    deployment {
        port = 8081
        port = ${?IDENTITY_PORT}
        shutdownGracePeriod = 5s
        shutdownTimeout = 15s
    }
    application {
        modules = [ com.ecommerce.identity.ApplicationKt.module ]
    }
}

identity {
    database {
        url = ${?IDENTITY_DATABASE_URL}
        username = ${?IDENTITY_DATABASE_USERNAME}
        password = ${?IDENTITY_DATABASE_PASSWORD}
        maximumPoolSize = 15
        connectionTimeoutMillis = 2000
    }
    redis {
        url = ${?IDENTITY_REDIS_URL}
    }
    jwt {
        issuer = "commerce-identity"
        audience = "commerce-api"
        accessTokenSeconds = 900
        refreshTokenDays = 30
        activeKeyId = ${?JWT_ACTIVE_KEY_ID}
        keys = ${?JWT_KEYS}
    }
    security {
        maxLoginAttempts = 8
        lockMinutes = 15
        otpExpirySeconds = 300
        otpMaxAttempts = 5
        otpResendSeconds = 60
    }
    challengeDelivery {
        url = ${?CHALLENGE_DELIVERY_URL}
        bearerToken = ${?CHALLENGE_DELIVERY_TOKEN}
    }
    oauth {
        googleUserInfoUrl = ${?GOOGLE_USERINFO_URL}
        appleUserInfoUrl = ${?APPLE_USERINFO_URL}
    }
    kafka {
        bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
        topic = "identity.events.v1"
        tenantId = ${?IDENTITY_TENANT_ID}
    }
}
