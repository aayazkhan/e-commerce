ktor { deployment { port = 8098; port = ${?RECOMMENDATION_PORT} } application { modules = [ com.ecommerce.recommendation.ApplicationKt.module ] } }
recommendation { database { url = ${?RECOMMENDATION_DATABASE_URL}; username = ${?DATABASE_USERNAME}; password = ${?DATABASE_PASSWORD}; maximumPoolSize = 20; connectionTimeoutMillis = 2000 } redis { url = ${?REDIS_URL} } kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; groupId = "recommendation-service-v1"; topics = "catalog.events.v1,order.events.v1,behavior.events.v1" } }
