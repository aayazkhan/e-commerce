ktor { deployment { port = 8100; port = ${?SELLER_PORT} } application { modules = [ com.ecommerce.seller.ApplicationKt.module ] } }
seller { database { url = ${?SELLER_DATABASE_URL}; username = ${?DATABASE_USERNAME}; password = ${?DATABASE_PASSWORD}; maximumPoolSize = 20; connectionTimeoutMillis = 2000 } redis { url = ${?REDIS_URL} } jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} } kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topic = "seller.events.v1"; topics = "order.events.v1"; groupId = "seller-service-v1"; tenantId = "default" } catalogUrl = ${?CATALOG_URL}; inventoryUrl = ${?INVENTORY_URL}; promotionUrl = ${?PROMOTION_URL}; analyticsUrl = ${?ANALYTICS_URL}; internalServiceToken = ${?INTERNAL_SERVICE_TOKEN} }
