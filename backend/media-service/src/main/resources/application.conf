ktor {
    deployment { port = 8085
 port = ${?MEDIA_PORT}
 shutdownGracePeriod = 5000
 shutdownTimeout = 15000
 requestTimeoutSeconds = 30 }
    application { modules = [ com.ecommerce.media.ApplicationKt.module ] }
}
media {
    database { url = ${?MEDIA_DATABASE_URL}
 username = ${?MEDIA_DATABASE_USERNAME}
 password = ${?MEDIA_DATABASE_PASSWORD}
 maximumPoolSize = 15
 connectionTimeoutMillis = 2000 }
    jwt { issuer = "commerce-identity"
 audience = "commerce-api"
 keys = ${?JWT_KEYS} }
    storage { bucket = ${?MEDIA_S3_BUCKET}
 region = "ap-south-1"
 endpoint = ${?MEDIA_S3_ENDPOINT}
 publicBaseUrl = ${?MEDIA_PUBLIC_BASE_URL}
 presignMinutes = 15
 maxBytes = 20971520 }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
 topic = "media.events.v1"
 tenantId = ${?IDENTITY_TENANT_ID} }
}
