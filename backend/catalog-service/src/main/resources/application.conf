ktor {
    deployment { port = 8083
 port = ${?CATALOG_PORT}
 shutdownGracePeriod = 5000
 shutdownTimeout = 15000 }
    application { modules = [ com.ecommerce.catalog.ApplicationKt.module ] }
}
catalog {
    database { url = ${?CATALOG_DATABASE_URL}
 username = ${?CATALOG_DATABASE_USERNAME}
 password = ${?CATALOG_DATABASE_PASSWORD}
 maximumPoolSize = 20
 connectionTimeoutMillis = 2000 }
    redis { url = ${?CATALOG_REDIS_URL} }
    jwt { issuer = "commerce-identity"
 audience = "commerce-api"
 keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
 topic = "catalog.events.v1"
 tenantId = ${?IDENTITY_TENANT_ID} }
    internalToken = ${?INTERNAL_SERVICE_TOKEN}
}
