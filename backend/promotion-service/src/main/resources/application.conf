ktor {
    deployment { port = 8090; port = ${?PROMOTION_PORT}; shutdownGracePeriod = 5s; shutdownTimeout = 15s }
    application { modules = [ com.ecommerce.promotion.ApplicationKt.module ] }
}
promotion {
    database { url = ${?PROMOTION_DATABASE_URL}; username = ${?PROMOTION_DATABASE_USERNAME}; password = ${?PROMOTION_DATABASE_PASSWORD}; maximumPoolSize = 30; connectionTimeoutMillis = 2000 }
    redis { url = ${?PROMOTION_REDIS_URL} }
    jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topic = "promotion.events.v1"; tenantId = ${?IDENTITY_TENANT_ID} }
    internalToken = ${?INTERNAL_SERVICE_TOKEN}
}
