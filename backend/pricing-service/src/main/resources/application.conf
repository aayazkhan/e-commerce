ktor {
    deployment { port = 8084; port = ${?PRICING_PORT}; shutdownGracePeriod = 5s; shutdownTimeout = 15s }
    application { modules = [ com.ecommerce.pricing.ApplicationKt.module ] }
}
pricing {
    database { url = ${?PRICING_DATABASE_URL}; username = ${?PRICING_DATABASE_USERNAME}; password = ${?PRICING_DATABASE_PASSWORD}; maximumPoolSize = 15; connectionTimeoutMillis = 2000 }
    redis { url = ${?PRICING_REDIS_URL} }
    jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topic = "pricing.events.v1"; tenantId = ${?IDENTITY_TENANT_ID} }
}
