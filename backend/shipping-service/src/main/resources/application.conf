ktor { deployment { port = 8093
 port = ${?SHIPPING_PORT}
 shutdownGracePeriod = 5000
 shutdownTimeout = 15000 }
 application { modules = [ com.ecommerce.shipping.ApplicationKt.module ] } }
shipping {
    database { url = ${?SHIPPING_DATABASE_URL}
 username = ${?SHIPPING_DATABASE_USERNAME}
 password = ${?SHIPPING_DATABASE_PASSWORD}
 maximumPoolSize = 30
 connectionTimeoutMillis = 2000 }
    jwt { issuer = "commerce-identity"
 audience = "commerce-api"
 keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
 topic = "shipping.events.v1"
 tenantId = ${?IDENTITY_TENANT_ID} }
    provider { baseUrl = ${?SHIPPING_PROVIDER_BASE_URL}
 apiKey = ${?SHIPPING_PROVIDER_API_KEY}
 webhookSecret = ${?SHIPPING_PROVIDER_WEBHOOK_SECRET} }
    internalToken = ${?INTERNAL_SERVICE_TOKEN}
}
