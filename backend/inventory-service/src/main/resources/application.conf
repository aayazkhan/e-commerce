ktor {
    deployment { port = 8087; port = ${?INVENTORY_PORT}; shutdownGracePeriod = 5s; shutdownTimeout = 15s }
    application { modules = [ com.ecommerce.inventory.ApplicationKt.module ] }
}
inventory {
    database { url = ${?INVENTORY_DATABASE_URL}; username = ${?INVENTORY_DATABASE_USERNAME}; password = ${?INVENTORY_DATABASE_PASSWORD}; maximumPoolSize = 30; connectionTimeoutMillis = 2000 }
    redis { url = ${?INVENTORY_REDIS_URL} }
    jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topic = "inventory.events.v1"; tenantId = ${?IDENTITY_TENANT_ID} }
    expirationIntervalSeconds = 5
    internalToken = ${?INTERNAL_SERVICE_TOKEN}
}
