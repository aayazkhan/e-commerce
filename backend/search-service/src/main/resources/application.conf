ktor {
    deployment { port = 8086; port = ${?SEARCH_PORT}; shutdownGracePeriod = 5s; shutdownTimeout = 15s }
    application { modules = [ com.ecommerce.search.ApplicationKt.module ] }
}
search {
    database { url = ${?SEARCH_DATABASE_URL}; username = ${?SEARCH_DATABASE_USERNAME}; password = ${?SEARCH_DATABASE_PASSWORD}; maximumPoolSize = 10; connectionTimeoutMillis = 2000 }
    opensearch { url = ${?OPENSEARCH_URL}; username = ${?OPENSEARCH_USERNAME}; password = ${?OPENSEARCH_PASSWORD}; alias = "products"; requestTimeoutMillis = 3000 }
    jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topics = "catalog.events.v1,pricing.events.v1,category.events.v1"; groupId = "search-service-v1" }
    catalogBaseUrl = ${?CATALOG_BASE_URL}
}
