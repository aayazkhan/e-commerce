ktor {
    deployment { port = 8089; port = ${?WISHLIST_PORT}; shutdownGracePeriod = 5s; shutdownTimeout = 15s }
    application { modules = [ com.ecommerce.wishlist.ApplicationKt.module ] }
}
wishlist {
    database { url = ${?WISHLIST_DATABASE_URL}; username = ${?WISHLIST_DATABASE_USERNAME}; password = ${?WISHLIST_DATABASE_PASSWORD}; maximumPoolSize = 20; connectionTimeoutMillis = 2000 }
    jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topic = "wishlist.events.v1"; tenantId = ${?IDENTITY_TENANT_ID} }
    pricingBaseUrl = ${?PRICING_BASE_URL}
    inventoryBaseUrl = ${?INVENTORY_BASE_URL}
}
