ktor { deployment { port = 8097
 port = ${?REVIEW_PORT} }
application { modules = [ com.ecommerce.review.ApplicationKt.module ] } }
review { database { url = ${?REVIEW_DATABASE_URL}
 username = ${?DATABASE_USERNAME}
 password = ${?DATABASE_PASSWORD}
 maximumPoolSize = 20
 connectionTimeoutMillis = 2000 }
jwt { issuer = "commerce-identity"
 audience = "commerce-api"
 keys = ${?JWT_KEYS} }
kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
 groupId = "review-service-v1"
 topics = "order.events.v1" }
moderation { autoPublish = false } }
