ktor {
    deployment { port = 8091; port = ${?ORDER_PORT}; shutdownGracePeriod = 5s; shutdownTimeout = 15s }
    application { modules = [ com.ecommerce.order.ApplicationKt.module ] }
}
order {
    database { url = ${?ORDER_DATABASE_URL}; username = ${?ORDER_DATABASE_USERNAME}; password = ${?ORDER_DATABASE_PASSWORD}; maximumPoolSize = 30; connectionTimeoutMillis = 2000 }
    jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topic = "order.events.v1"; tenantId = ${?IDENTITY_TENANT_ID} }
    internalToken = ${?INTERNAL_SERVICE_TOKEN}
}
