ktor { deployment { port = 8092
 port = ${?PAYMENT_PORT}
 shutdownGracePeriod = 5000
 shutdownTimeout = 15000 }
 application { modules = [ com.ecommerce.payment.ApplicationKt.module ] } }
payment {
    database { url = ${?PAYMENT_DATABASE_URL}
 username = ${?PAYMENT_DATABASE_USERNAME}
 password = ${?PAYMENT_DATABASE_PASSWORD}
 maximumPoolSize = 30
 connectionTimeoutMillis = 2000 }
    jwt { issuer = "commerce-identity"
 audience = "commerce-api"
 keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
 topic = "payment.events.v1"
 tenantId = ${?IDENTITY_TENANT_ID} }
    provider { baseUrl = ${?PAYMENT_PROVIDER_BASE_URL}
 apiKey = ${?PAYMENT_PROVIDER_API_KEY}
 webhookSecret = ${?PAYMENT_PROVIDER_WEBHOOK_SECRET} }
    payu { merchantKey = ${?PAYU_MERCHANT_KEY}
 merchantSalt = ${?PAYU_MERCHANT_SALT}
 baseUrl = ${?PAYU_BASE_URL}
 callbackBaseUrl = ${?PAYU_CALLBACK_BASE_URL}
 returnBaseUrl = ${?PAYU_RETURN_BASE_URL} }
    internalToken = ${?INTERNAL_SERVICE_TOKEN}
    reconciliationIntervalSeconds = 30
}
