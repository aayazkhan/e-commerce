ktor { deployment { port = 8103
 port = ${?FLAGS_PORT} }
application { modules = [ com.ecommerce.flags.ApplicationKt.module ] } }
flags { database { url = ${?FLAGS_DATABASE_URL}
 username = ${?DATABASE_USERNAME}
 password = ${?DATABASE_PASSWORD}
 maximumPoolSize = 20
 connectionTimeoutMillis = 2000 }
redis { url = ${?REDIS_URL} }
jwt { issuer = "commerce-identity"
 audience = "commerce-api"
 keys = ${?JWT_KEYS} }
kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
 topic = "feature-flags.events.v1"
 tenantId = "default" } }
