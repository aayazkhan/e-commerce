ktor { deployment { port = 8104; port = ${?ADMIN_PORT} } application { modules = [ com.ecommerce.admin.ApplicationKt.module ] } }
admin { database { url = ${?ADMIN_DATABASE_URL}; username = ${?DATABASE_USERNAME}; password = ${?DATABASE_PASSWORD}; maximumPoolSize = 20; connectionTimeoutMillis = 2000 } jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} } kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topic = "admin.events.v1"; tenantId = "default" } internalServiceToken = ${?INTERNAL_SERVICE_TOKEN}; identityUrl = ${?IDENTITY_URL}; sellerUrl = ${?SELLER_URL}; catalogUrl = ${?CATALOG_URL}; orderUrl = ${?ORDER_URL}; analyticsUrl = ${?ANALYTICS_URL}; auditUrl = ${?AUDIT_URL}; cmsUrl = ${?CMS_URL}; flagsUrl = ${?FLAGS_URL} }
