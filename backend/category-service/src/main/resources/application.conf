ktor {
    deployment { port = 8082
 port = ${?CATEGORY_PORT}
 shutdownGracePeriod = 5000
 shutdownTimeout = 15000 }
    application { modules = [ com.ecommerce.category.ApplicationKt.module ] }
}
category {
    database { url = ${?CATEGORY_DATABASE_URL}
 username = ${?CATEGORY_DATABASE_USERNAME}
 password = ${?CATEGORY_DATABASE_PASSWORD}
 maximumPoolSize = 15
 connectionTimeoutMillis = 2000 }
    redis { url = ${?CATEGORY_REDIS_URL} }
    jwt { issuer = "commerce-identity"
 audience = "commerce-api"
 activeKeyId = ${?JWT_ACTIVE_KEY_ID}
 keys = ${?JWT_KEYS} }
    kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
 topic = "category.events.v1"
 tenantId = ${?IDENTITY_TENANT_ID} }
}
