ktor { deployment { port = 8101; port = ${?CMS_PORT} } application { modules = [ com.ecommerce.cms.ApplicationKt.module ] } }
cms { database { url = ${?CMS_DATABASE_URL}; username = ${?DATABASE_USERNAME}; password = ${?DATABASE_PASSWORD}; maximumPoolSize = 20; connectionTimeoutMillis = 2000 } redis { url = ${?REDIS_URL} } jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} } kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; topic = "cms.events.v1"; tenantId = "default" } }
