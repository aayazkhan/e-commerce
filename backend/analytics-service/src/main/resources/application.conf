ktor { deployment { port = 8099; port = ${?ANALYTICS_PORT} } application { modules = [ com.ecommerce.analytics.ApplicationKt.module ] } }
analytics { database { url = ${?ANALYTICS_DATABASE_URL}; username = ${?DATABASE_USERNAME}; password = ${?DATABASE_PASSWORD}; maximumPoolSize = 20; connectionTimeoutMillis = 2000 } jwt { issuer = "commerce-identity"; audience = "commerce-api"; keys = ${?JWT_KEYS} } kafka { bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}; groupId = "analytics-service-v1"; topics = "order.events.v1,payment.events.v1,shipping.events.v1,refund.events.v1,checkout.events.v1,catalog.events.v1,behavior.events.v1" } }
